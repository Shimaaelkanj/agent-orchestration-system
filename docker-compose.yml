
name: agent-orchestration

x-env: &env
  DATABASE_URL: postgresql://agent:agent@postgres:5432/agent
  REDIS_URL: redis://redis:6379/0
  WORKING_MEMORY_BACKEND: redis
  CELERY_ENABLED: "1"
  ASYNC_SPECIALISTS: "1"
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  MAX_PARALLEL: "4"
  # models: your host's Ollama (used by live mode, the review chat panel and ollama embeddings)
  OPENAI_API_KEY: ollama
  OPENAI_BASE_URL: http://host.docker.internal:11434/v1
  SUPERVISOR_PROVIDER: openai
  SUPERVISOR_MODEL: ${SUPERVISOR_MODEL:-llama3.2}
  SPECIALIST_PROVIDER: openai
  SPECIALIST_MODEL: ${SPECIALIST_MODEL:-llama3.2}
  REVIEWER_PROVIDER: openai
  REVIEWER_MODEL: ${REVIEWER_MODEL:-llama3.2}
  EMBED_PROVIDER: ${DOCKER_EMBED_PROVIDER:-hash}
  EMBED_MODEL: nomic-embed-text
  EMBED_BASE_URL: http://host.docker.internal:11434
  MEMORY_MIN_SIMILARITY: "0.15"
  USE_LLM_EXTRACTION: ${DOCKER_USE_LLM_EXTRACTION:-0}
  # demo: 1 = scripted deterministic agents, 0 = your real models
  DEMO_MODE: ${DEMO_MODE:-1}
  STRIP_FINAL_WRITING: ${STRIP_FINAL_WRITING:-0}
  ADMIN_API_KEY: ${ADMIN_API_KEY:-}

x-app: &app
  image: agent-orchestration:latest
  pull_policy: never
  extra_hosts: ["host.docker.internal:host-gateway"]
  environment: *env

services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: agent, POSTGRES_PASSWORD: agent, POSTGRES_DB: agent}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  chroma:
    image: chromadb/chroma:${CHROMA_VERSION:-latest}
    environment: {IS_PERSISTENT: "TRUE", PERSIST_DIRECTORY: /data, ANONYMIZED_TELEMETRY: "FALSE"}
    volumes: [chroma:/data]

  init:                       # creates every table once, then exits
    <<: *app
    build:
      context: .
      args:
        CHROMA_VERSION: ${CHROMA_VERSION:-}
    command: python -m orchestrator.db init
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    <<: *app
    command: uvicorn orchestrator.api.main:app --host 0.0.0.0 --port 8080
    ports: ["127.0.0.1:${API_PORT:-8081}:8080"]
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      chroma: {condition: service_started}

  worker:                     # runs whole tasks and resumes (the orchestration queue)
    <<: *app
    command: celery -A orchestrator.worker.celery_app worker -Q orchestration -c 2 -n orchestration@%h --loglevel=INFO
    volumes: [workspace:/app/workspace]
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      chroma: {condition: service_started}

  specialist-worker:          # runs specialist attempts in parallel (the specialists queue)
    <<: *app
    command: celery -A orchestrator.worker.celery_app worker -Q specialists -c 3 -n specialists@%h --loglevel=INFO
    volumes: [workspace:/app/workspace]
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      chroma: {condition: service_started}

  review-ui:
    <<: *app
    command: streamlit run orchestrator/hitl/ui.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      chroma: {condition: service_started}

  trace-ui:
    <<: *app
    command: streamlit run orchestrator/obs/ui.py --server.port=8502 --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
    ports: ["127.0.0.1:8502:8502"]
    depends_on:
      init: {condition: service_completed_successfully}

  demo:                       # run on demand: docker compose --profile demo run --rm demo
    <<: *app
    profiles: ["demo"]
    command: python scripts/demo.py
    environment:
      <<: *env
      API_URL: http://api:8080
      PUBLIC_API_URL: http://localhost:${API_PORT:-8081}
      PYTHONPATH: /app
    depends_on:
      api: {condition: service_started}
      worker: {condition: service_started}
      specialist-worker: {condition: service_started}

volumes:
  pgdata:
  chroma:
  workspace: